name: Build and Push Docker Images

on:
  push:
    branches: [master]
    paths:
      - "docker/Dockerfile.*"
      - "Makefile"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: oaklight/texlive

jobs:
  # ---- Fetch tex-fmt binaries ----
  fetch-tex-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest tex-fmt version
        id: version
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/WGUNDERWOOD/tex-fmt/releases/latest | jq -r .tag_name)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download tex-fmt binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p linux/amd64 linux/arm64 alpine/amd64
          curl -L -o tex-fmt-x86_64-linux.tar.gz "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${VERSION}/tex-fmt-x86_64-linux.tar.gz"
          curl -L -o tex-fmt-aarch64-linux.tar.gz "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${VERSION}/tex-fmt-aarch64-linux.tar.gz"
          curl -L -o tex-fmt-x86_64-alpine.tar.gz "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${VERSION}/tex-fmt-x86_64-alpine.tar.gz"
          tar -xzf tex-fmt-x86_64-linux.tar.gz -C linux/amd64
          tar -xzf tex-fmt-aarch64-linux.tar.gz -C linux/arm64
          tar -xzf tex-fmt-x86_64-alpine.tar.gz -C alpine/amd64

      - name: Upload tex-fmt artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tex-fmt-binaries
          path: |
            linux/amd64/tex-fmt
            linux/arm64/tex-fmt
            alpine/amd64/tex-fmt

  # ---- Debian images ----
  debian-base:
    needs: fetch-tex-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tex-fmt-binaries

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-base
          push: true
          cache-from: type=gha,scope=debian-base
          cache-to: type=gha,mode=max,scope=debian-base
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          tags: |
            ${{ env.IMAGE_NAME }}:base
            ${{ env.IMAGE_NAME }}:debian-base
          platforms: linux/amd64,linux/arm64
          build-args: TEX_FMT_DIR=linux

  debian-science:
    needs: debian-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push science
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-science
          push: true
          cache-from: type=gha,scope=debian-science
          cache-to: type=gha,mode=max,scope=debian-science
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:science
            ${{ env.IMAGE_NAME }}:debian-science
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:base

  debian-lang:
    needs: [debian-base, debian-science]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ---- Chinese ----
      - name: Build and push base-cn
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-cn
          push: true
          cache-from: type=gha,scope=debian-base-cn
          cache-to: type=gha,mode=max,scope=debian-base-cn
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:base-cn
            ${{ env.IMAGE_NAME }}:debian-base-cn
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:base

      - name: Build and push science-cn
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-cn
          push: true
          cache-from: type=gha,scope=debian-science-cn
          cache-to: type=gha,mode=max,scope=debian-science-cn
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:science-cn
            ${{ env.IMAGE_NAME }}:debian-science-cn
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:science

      # ---- Japanese ----
      - name: Build and push base-jp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-jp
          push: true
          cache-from: type=gha,scope=debian-base-jp
          cache-to: type=gha,mode=max,scope=debian-base-jp
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:base-jp
            ${{ env.IMAGE_NAME }}:debian-base-jp
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:base

      - name: Build and push science-jp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-jp
          push: true
          cache-from: type=gha,scope=debian-science-jp
          cache-to: type=gha,mode=max,scope=debian-science-jp
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:science-jp
            ${{ env.IMAGE_NAME }}:debian-science-jp
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:science

      # ---- Korean ----
      - name: Build and push base-kr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-kr
          push: true
          cache-from: type=gha,scope=debian-base-kr
          cache-to: type=gha,mode=max,scope=debian-base-kr
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:base-kr
            ${{ env.IMAGE_NAME }}:debian-base-kr
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:base

      - name: Build and push science-kr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.debian-kr
          push: true
          cache-from: type=gha,scope=debian-science-kr
          cache-to: type=gha,mode=max,scope=debian-science-kr
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:science-kr
            ${{ env.IMAGE_NAME }}:debian-science-kr
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:science

  # ---- Alpine images ----
  alpine-base:
    needs: fetch-tex-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tex-fmt-binaries

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push alpine-base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-base
          push: true
          cache-from: type=gha,scope=alpine-base
          cache-to: type=gha,mode=max,scope=alpine-base
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-base
          build-args: TEX_FMT_DIR=alpine

  alpine-science:
    needs: alpine-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push alpine-science
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-science
          push: true
          cache-from: type=gha,scope=alpine-science
          cache-to: type=gha,mode=max,scope=alpine-science
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:alpine-science
            ${{ env.IMAGE_NAME }}:latest
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-base

  alpine-lang:
    needs: [alpine-base, alpine-science]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ---- Chinese ----
      - name: Build and push alpine-base-cn
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-cn
          push: true
          cache-from: type=gha,scope=alpine-base-cn
          cache-to: type=gha,mode=max,scope=alpine-base-cn
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-base-cn
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-base

      - name: Build and push alpine-science-cn
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-cn
          push: true
          cache-from: type=gha,scope=alpine-science-cn
          cache-to: type=gha,mode=max,scope=alpine-science-cn
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-science-cn
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-science

      # ---- Japanese ----
      - name: Build and push alpine-base-jp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-jp
          push: true
          cache-from: type=gha,scope=alpine-base-jp
          cache-to: type=gha,mode=max,scope=alpine-base-jp
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-base-jp
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-base

      - name: Build and push alpine-science-jp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-jp
          push: true
          cache-from: type=gha,scope=alpine-science-jp
          cache-to: type=gha,mode=max,scope=alpine-science-jp
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-science-jp
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-science

      # ---- Korean ----
      - name: Build and push alpine-base-kr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-kr
          push: true
          cache-from: type=gha,scope=alpine-base-kr
          cache-to: type=gha,mode=max,scope=alpine-base-kr
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-base-kr
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-base

      - name: Build and push alpine-science-kr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.alpine-kr
          push: true
          cache-from: type=gha,scope=alpine-science-kr
          cache-to: type=gha,mode=max,scope=alpine-science-kr
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:alpine-science-kr
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:alpine-science

  smoke:
    needs: [debian-lang, alpine-lang]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tag:
          - alpine-science-cn
          - debian-science-cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull image
        run: docker pull "${{ env.IMAGE_NAME }}:${{ matrix.tag }}"
      - name: Smoke test
        run: sh test/smoke.sh "${{ env.IMAGE_NAME }}:${{ matrix.tag }}"

  # BuildKit's built-in SBOM attestation fails on the TeX Live images: the
  # file-level SPDX document exceeds the 80 MiB manifest limit. Generate SBOMs
  # as workflow artifacts instead, running Syft from a pinned container image
  # rather than letting an action download a release binary. The GitHub release
  # CDN intermittently returns 502, which failed 2/16 jobs on run 43970680778;
  # the retry loop below absorbs that without rerunning the whole workflow.
  sbom:
    needs: [debian-lang, alpine-lang]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tag:
          - base
          - science
          - base-cn
          - science-cn
          - base-jp
          - science-jp
          - base-kr
          - science-kr
          - alpine-base
          - alpine-science
          - alpine-base-cn
          - alpine-science-cn
          - alpine-base-jp
          - alpine-science-jp
          - alpine-base-kr
          - alpine-science-kr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate SBOM
        env:
          SYFT_REGISTRY_AUTH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SYFT_REGISTRY_AUTH_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          out="$RUNNER_TEMP/sbom-${{ matrix.tag }}.spdx.json"
          for attempt in 1 2 3; do
            if docker run --rm \
                -e SYFT_REGISTRY_AUTH_USERNAME \
                -e SYFT_REGISTRY_AUTH_PASSWORD \
                -v "$RUNNER_TEMP:/out" \
                anchore/syft:v1.42.3@sha256:76ccb84f37da4c8123370b2cdcb62a7a832458fff7eec97e3f7b79e605ec690c \
                scan "registry:${{ env.IMAGE_NAME }}:${{ matrix.tag }}" \
                --platform linux/amd64 \
                -q -o "spdx-json=/out/sbom-${{ matrix.tag }}.spdx.json"; then
              if [ -s "$out" ]; then
                cp "$out" "sbom-${{ matrix.tag }}.spdx.json"
                exit 0
              fi
            fi
            echo "::warning::SBOM scan attempt $attempt failed for ${{ matrix.tag }}"
            rm -f "$out"
            [ "$attempt" -eq 3 ] || sleep "$((attempt * 20))"
          done
          echo "::error::SBOM scan failed for ${{ matrix.tag }} after 3 attempts"
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.tag }}.spdx.json
          path: sbom-${{ matrix.tag }}.spdx.json
          if-no-files-found: error

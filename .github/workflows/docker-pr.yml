name: Build Pull Request Images

on:
  pull_request:
    paths:
      - "docker/Dockerfile.*"
      - "Makefile"
      - "test/smoke.sh"
      - ".dockerignore"
      - ".github/workflows/docker-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: oaklight/texlive

jobs:
  fetch-tex-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest tex-fmt version
        id: version
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/WGUNDERWOOD/tex-fmt/releases/latest | jq -r .tag_name)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download tex-fmt binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p linux/amd64 alpine/amd64
          curl -L -o tex-fmt-x86_64-linux.tar.gz "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${VERSION}/tex-fmt-x86_64-linux.tar.gz"
          curl -L -o tex-fmt-x86_64-alpine.tar.gz "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${VERSION}/tex-fmt-x86_64-alpine.tar.gz"
          tar -xzf tex-fmt-x86_64-linux.tar.gz -C linux/amd64
          tar -xzf tex-fmt-x86_64-alpine.tar.gz -C alpine/amd64

      - name: Upload tex-fmt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tex-fmt-binaries
          path: |
            linux/amd64/tex-fmt
            alpine/amd64/tex-fmt

  build-alpine:
    needs: fetch-tex-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tex-fmt-binaries
      - uses: docker/setup-buildx-action@v3

      - name: Build alpine-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.alpine-base
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-alpine-base
          build-args: TEX_FMT_DIR=alpine
          cache-from: type=gha,scope=pr-alpine-base
          cache-to: type=gha,mode=max,scope=pr-alpine-base

      - name: Build alpine-science
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.alpine-science
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-alpine-science
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:pr-alpine-base
          cache-from: type=gha,scope=pr-alpine-science
          cache-to: type=gha,mode=max,scope=pr-alpine-science

      - name: Build alpine-science-cn
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.alpine-cn
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-alpine-science-cn
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:pr-alpine-science
          cache-from: type=gha,scope=pr-alpine-science-cn
          cache-to: type=gha,mode=max,scope=pr-alpine-science-cn

      - name: Smoke test alpine-science-cn
        run: sh test/smoke.sh "${{ env.IMAGE_NAME }}:pr-alpine-science-cn"

  build-debian:
    needs: fetch-tex-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tex-fmt-binaries
      - uses: docker/setup-buildx-action@v3

      - name: Build debian-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.debian-base
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-debian-base
          build-args: TEX_FMT_DIR=linux
          cache-from: type=gha,scope=pr-debian-base
          cache-to: type=gha,mode=max,scope=pr-debian-base

      - name: Build debian-science
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.debian-science
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-debian-science
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:pr-debian-base
          cache-from: type=gha,scope=pr-debian-science
          cache-to: type=gha,mode=max,scope=pr-debian-science

      - name: Build debian-science-cn
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.debian-cn
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-debian-science-cn
          build-args: BASE_IMAGE=${{ env.IMAGE_NAME }}:pr-debian-science
          cache-from: type=gha,scope=pr-debian-science-cn
          cache-to: type=gha,mode=max,scope=pr-debian-science-cn

      - name: Smoke test debian-science-cn
        run: sh test/smoke.sh "${{ env.IMAGE_NAME }}:pr-debian-science-cn"
